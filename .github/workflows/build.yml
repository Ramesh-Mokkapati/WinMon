name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} | ${{ matrix.platform }}
    # windows-2022 ships Visual Studio 2022 with the v143 toolset and MFC.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86]
        include:
          # The solution platform x86 builds the project's Win32 platform, which is the folder name under bin\.
          - platform: x64
            outdir: x64
          - platform: x86
            outdir: Win32

    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild WinMon.sln -m -nologo -verbosity:minimal -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      # Launches the GUI, lets the polling thread run, then closes it. Catches debug assertions,
      # startup crashes and shutdown hangs. Hosted runners run elevated, so the Release build's
      # requireAdministrator manifest does not prompt.
      - name: Smoke test
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File Tests\SmokeTest.ps1 -Configuration ${{ matrix.configuration }} -Platform ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw "SmokeTest.ps1 failed with exit code $LASTEXITCODE" }

      - name: Upload binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: WinMon-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            bin/${{ matrix.outdir }}/${{ matrix.configuration }}/WinMon.exe
            bin/${{ matrix.outdir }}/${{ matrix.configuration }}/WinMon.pdb
          if-no-files-found: error

  release:
    name: Release
    # Every push to main whose builds and smoke tests all pass gets its own tag and GitHub release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    # Pinned rather than ubuntu-latest so the image doesn't change under us (the job only needs zip and gh).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Bump the major/minor here; the patch number is the workflow run number.
      VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: WinMon-*-Release
          path: artifacts

      # One zip per platform: WinMon.exe (MFC linked statically, no redistributable needed) and its PDB.
      - name: Zip binaries
        run: |
          mkdir release
          for platform in x64 x86; do
            (cd "artifacts/WinMon-$platform-Release" && zip -r "$GITHUB_WORKSPACE/release/WinMon-$platform.zip" .)
          done

      # gh creates the tag on the pushed commit and generates notes from the commits since the
      # previous release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$VERSION" release/*.zip
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "WinMon $VERSION"
          --generate-notes
          --latest
